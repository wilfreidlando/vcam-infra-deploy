# Page « État de la plateforme » (ADR-0071) : quelle version tourne où, en CONSULTATION SEULE. Un nginx qui sert deux fichiers statiques
# (index.html, status.json) écrits par `vps-overview --html` ; aucun code applicatif, aucun accès à Docker, aucun secret.
# PROTOTYPE SANS AUTHENTIFICATION (décision du 2026-10-07, à encadrer : voir l'ADR). Publiée par nginx-proxy comme Grafana.
#
#   cp overview/.env.example overview/.env        # le nom public (OVERVIEW_HOST)
#   docker compose -f overview/compose.yaml --env-file overview/.env up -d
#
# La page est régénérée par la minuterie systemd de host/ (une fois par minute). Voir docs/reference/page-detat-de-la-plateforme.md.
name: overview

services:
  overview:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: vps-overview
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      VIRTUAL_HOST: ${OVERVIEW_HOST:?OVERVIEW_HOST obligatoire (ex. plateforme.visibilitycam.com)}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${OVERVIEW_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      # Lecture seule : le conteneur ne peut ni écrire la page ni la corrompre.
      - ${OVERVIEW_DIR:-/var/lib/vps-platform/overview}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [nginx-proxy]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  nginx-proxy:
    name: ${NGINX_PROXY_NETWORK:-nginx-proxy}
    external: true
