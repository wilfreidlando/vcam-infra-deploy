# Deux fichiers statiques et rien d'autre. Pas de liste de dossier, pas de méthode d'écriture, pas de mise en cache (la page change chaque minute).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

    # Lecture seule : toute autre méthode est refusée (limit_except n'existe que dans un « location »).
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location = / { try_files /index.html =404; }
    location = /index.html { }
    location = /status.json { default_type application/json; }
    location / { return 404; }
}
