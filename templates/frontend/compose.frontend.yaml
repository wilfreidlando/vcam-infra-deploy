# VPS standard — frontend (React / Angular / Vue SPA, or Next.js)
# (README.md). No observability, no database: one container behind
# nginx-proxy. Copy as compose.prod.yaml, keep ONE of the two `app` variants.

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ── Variant A: SPA (Dockerfile.spa) — one image for staging and prod ──
  app:
    <<: *defaults
    image: mon-front:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.spa
      args:
        BUILD_DIR: dist                 # build (CRA), dist/<app>/browser (Angular)
    environment:
      VIRTUAL_HOST: ${APP_PUBLIC_HOST}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${APP_PUBLIC_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # Runtime config → window.__ENV__ (PUBLIC_* only, never a secret)
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    networks: [ nginx-proxy ]
    deploy: { resources: { limits: { cpus: "0.25", memory: "64M" } } }

  # ── Variant B: Next.js (Dockerfile.nextjs) — set BUILD_PER_ENV=1 ──
  # app:
  #   <<: *defaults
  #   image: mon-front:${IMAGE_TAG:-latest}
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.nextjs
  #     args:
  #       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #   env_file: [ "${ENV_FILE:-.env}" ]     # server-side variables
  #   environment:
  #     VIRTUAL_HOST: ${APP_PUBLIC_HOST}
  #     VIRTUAL_PORT: "3000"
  #     LETSENCRYPT_HOST: ${APP_PUBLIC_HOST}
  #     LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
  #   networks: [ nginx-proxy ]
  #   deploy: { resources: { limits: { cpus: "1.0", memory: "512M" } } }

networks:
  nginx-proxy:
    external: true
