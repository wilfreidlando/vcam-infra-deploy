# VPS standard — SPA served behind nginx-proxy (TLS terminated there).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Runtime config and the entry page: never cached, so a deploy is seen at once.
    location = /env.js { add_header Cache-Control "no-store" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    # Fingerprinted build assets: cached for a year.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
