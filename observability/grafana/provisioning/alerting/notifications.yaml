# Notifications de TOUTE la plateforme : le point de contact (e-mail) et la politique qui l'applique à toutes les alertes.
# Un projet ne peut PAS les modifier (bin/obs-bundle.py refuse tout fichier d'alertes qui en contient). Contact point: e-mail to
# GRAFANA_ALERT_EMAIL (Grafana needs GF_SMTP_* to actually send — see
# observability/README.md and guides/17-comprendre-et-lire-grafana.md).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: core-oncall
    receivers:
      - uid: core-oncall-email
        type: email
        settings:
          addresses: ${GRAFANA_ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: core-oncall
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Les alertes étiquetées « cadence=daily » (par exemple une sauvegarde de production désactivée ou en échec) sont rappelées UNE FOIS PAR JOUR,
      # pas toutes les 4 h : un état connu et accepté ne doit pas remplir la boîte aux lettres. Un projet peut poser cette étiquette sur ses propres règles.
      - receiver: core-oncall
        object_matchers:
          - ['cadence', '=', 'daily']
        group_by: ['alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
